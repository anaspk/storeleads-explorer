[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storeleads-backend"
version = "0.1.0"
description = "Local API for exploring Store Leads data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
